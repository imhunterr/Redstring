<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>redstring · board</title>
<meta name="robots" content="noindex, nofollow">
<script>
  // set theme before paint (no flash)
  (function(){var t;try{t=localStorage.getItem("redstring-theme");}catch(e){}
   if(!t){t=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}
   document.documentElement.setAttribute("data-theme",t);})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/css/redstring.css">
</head>
<body data-page="board">
<header id="topbar" class="topbar"></header>

<main class="wrap">

  <section class="page-head board-head">
    <p class="typed">CASE #001 · ISSQUARED PORTFOLIO · STATUS: ACTIVE</p>
    <h1>Everything about ISSQUARED,<br>pinned and connected.</h1>
  </section>

  <section class="section flush" id="board">
    <div class="board-bar">
      <div class="chips" id="board-chips" role="group" aria-label="Filter by type"></div>
      <span class="spacer"></span>
      <button class="btn ghost sm" id="tie-btn" type="button" aria-pressed="false" title="Connect two cards">🧵 tie string</button>
      <button class="btn red sm" id="pin-btn" type="button">+ pin card</button>
    </div>

    <div class="board-shell">
      <div class="board-scroll">
        <div class="board" id="board-main">
          <svg class="strings" aria-hidden="true"></svg>
          <div class="board-empty" id="board-empty" hidden>
            <strong>Empty cork.</strong>Pin your first card, or turn the type filters back on.
          </div>
        </div>
      </div>
      <div class="board-legend">
        <span class="label" id="board-hint"></span>
        <span class="label" id="board-count"></span>
      </div>
    </div>
  </section>
</main>

<footer id="footer" class="foot"></footer>
<script src="static/js/store.js"></script>
<script src="static/js/ui.js"></script>
<script src="static/js/board.js"></script>
</body>
</html>
