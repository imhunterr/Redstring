<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>redstring · map</title>
<meta name="robots" content="noindex, nofollow">
<script>
  // set theme before paint (no flash)
  (function(){var t;try{t=localStorage.getItem("redstring-theme");}catch(e){}
   if(!t){t=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}
   document.documentElement.setAttribute("data-theme",t);})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/css/redstring.css">
</head>
<body data-page="map">
<header id="topbar" class="topbar"></header>

<main class="wrap">

  <section class="page-head map-head">
    <p class="typed">FOLLOW THE STRING</p>
    <h1>Map</h1>
    <p class="lede">One file in the middle, everything it's tied to around it. Click a file to walk the string.</p>
  </section>
  <section class="section flush">
    <div class="map-bar"><div id="map-trail" class="map-trail"></div><span class="spacer"></span><div id="map-pick"></div></div>
    <div class="board-shell">
      <div class="map-stage" id="map-stage">
        <svg class="strings" aria-hidden="true"></svg>
      </div>
      <p class="map-note label" id="map-note"></p>
    </div>
  </section>
</main>

<footer id="footer" class="foot"></footer>
<script src="static/js/store.js"></script>
<script src="static/js/ui.js"></script>
<script src="static/js/map.js"></script>
</body>
</html>
